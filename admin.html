<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Área do ADM — Café BPX</title>
  <meta name="description" content="Administração de disponibilidade dos cafés da BPX." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin-overrides.css" />
</head>
<body data-page="admin">
  <div class="site-shell">
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand-wrap" href="index.html" aria-label="Café BPX - início">
          <div class="brand-mark"><span>☕</span></div>
          <div class="brand-copy">
            <div class="brand-title">CAFÉ BPX</div>
            <div class="brand-subtitle">Área do administrador</div>
          </div>
        </a>
        <a class="admin-link" href="index.html">Sair</a>
      </div>
    </header>

    <main class="container main-flow admin-main">
      <section class="section-head admin-head">
        <div class="admin-heading-copy">
          <h2>Controle de Disponibilidade</h2>
          <p class="admin-subtitle">Ative ou desative cada bebida e salve o status atual</p>
        </div>
        <div class="admin-actions">
          <div id="adminAvailability" class="availability-pill">9 de 12 disponíveis</div>
          <button id="saveBtn" class="save-btn icon-save-btn" type="button" aria-label="Salvar disponibilidade">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v11"></path>
              <path d="M8 10l4 4 4-4"></path>
              <path d="M4 17v3h16v-3"></path>
            </svg>
          </button>
        </div>
      </section>

      <section id="adminGrid" class="coffee-grid admin-grid" aria-label="Painel administrativo"></section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
