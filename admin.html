<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Área do ADM — Café BPX</title>
  <meta name="description" content="Administração de disponibilidade dos cafés da BPX." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin-overrides.css" />
</head>
<body data-page="admin">
  <div class="site-shell">
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand-wrap" href="index.html" aria-label="Café BPX - início">
          <div class="brand-mark"><span>☕</span></div>
          <div class="brand-copy">
            <div class="brand-title">CAFÉ BPX</div>
            <div class="brand-subtitle">Área do administrador</div>
          </div>
        </a>
        <a class="admin-link" href="index.html">Sair</a>
      </div>
    </header>

    <main class="container main-flow admin-main">
      <section class="section-head admin-head">
        <div class="admin-heading-copy">
          <h2>Controle de Estoque</h2>
          <p class="admin-subtitle">Cadastre tipos de café e ajuste quantas unidades ainda existem</p>
        </div>
        <div class="admin-actions">
          <div id="adminAvailability" class="availability-pill">0 unidades</div>
          <button id="saveBtn" class="save-btn icon-save-btn" type="button">
            <span>Salvar opções</span>
          </button>
        </div>
      </section>

      <form id="coffeeForm" class="coffee-form" autocomplete="off">
        <label>
          <span>Tipo de café</span>
          <input id="coffeeName" type="text" maxlength="48" placeholder="Ex.: Cappuccino especial" required>
        </label>
        <label>
          <span>Unidades</span>
          <input id="coffeeUnits" type="number" min="0" step="1" placeholder="0" required>
        </label>
        <button class="save-btn form-save-btn" type="submit">Cadastrar</button>
      </form>

      <section id="adminGrid" class="coffee-grid admin-grid" aria-label="Painel administrativo"></section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
